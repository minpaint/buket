<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ошибка сервера — Buket.by</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/static/logo.png">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'Segoe UI',Arial,sans-serif;
      background:#f3f9f1;
      color:#111827;
      min-height:100vh;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      padding:24px;
    }
    .logo{margin-bottom:32px}
    .logo img{height:52px;width:auto}
    .card{
      background:#fff;border-radius:20px;
      box-shadow:0 8px 32px rgba(0,0,0,.10);
      padding:48px 40px;max-width:520px;width:100%;text-align:center;
    }
    .code{font-size:80px;font-weight:900;color:#dc2626;line-height:1;margin-bottom:8px}
    h1{font-size:22px;font-weight:700;color:#1f2937;margin-bottom:12px}
    p{color:#6b7280;font-size:15px;line-height:1.6;margin-bottom:28px}
    .btn{
      display:inline-block;
      background:#166534;color:#fff;
      border-radius:999px;padding:13px 32px;
      font-size:15px;font-weight:700;text-decoration:none;
      transition:background .2s;
    }
    .btn:hover{background:#14532d}
    .phone{margin-top:20px;color:#374151;font-size:14px}
    .phone a{color:#166534;font-weight:600;text-decoration:none}
    @media(max-width:480px){
      .card{padding:32px 20px}
      .code{font-size:60px}
    }
  </style>
</head>
<body>
  <div class="logo">
    <a href="/"><img src="/static/logo.png" alt="Buket.by"></a>
  </div>
  <div class="card">
    <div class="code">500</div>
    <h1>Что-то пошло не так</h1>
    <p>На нашем сервере произошла ошибка. Мы уже знаем о ней и исправляем.<br>Попробуйте вернуться на главную или позвоните нам напрямую.</p>
    <a href="/" class="btn">На главную</a>
    <div class="phone">
      Заказать по телефону: <a href="tel:+375291234567">+375 (29) 123-45-67</a>
    </div>
  </div>
</body>
</html>
