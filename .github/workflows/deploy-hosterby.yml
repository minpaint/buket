name: Deploy to hoster.by

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hosterby-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTER_HOST }}
          username: ${{ secrets.HOSTER_USER }}
          key: ${{ secrets.HOSTER_SSH_KEY }}
          port: 22
          script: |
            set -Eeuo pipefail

            DEPLOY_ROOT="${{ secrets.HOSTER_DEPLOY_PATH }}"
            BACKEND_DIR="$DEPLOY_ROOT/backend"
            cd "$DEPLOY_ROOT"

            # Обновить код
            git fetch origin
            git reset --hard origin/main

            # Панель hoster.by может пересоздать virtualenv при изменении корня сайта.
            # Ищем актуальный Python вместо жёсткой привязки к старому public_html/myapp.
            PYTHON_BIN=""
            for candidate in \
              /home/buketby/virtualenv/www/buket.by/3.13/bin/python \
              /home/buketby/virtualenv/www/buket.by/backend/3.13/bin/python \
              /home/buketby/virtualenv/public_html/myapp/backend/3.13/bin/python
            do
              if [[ -x "$candidate" ]]; then
                PYTHON_BIN="$candidate"
                break
              fi
            done

            if [[ -z "$PYTHON_BIN" && -d /home/buketby/virtualenv ]]; then
              PYTHON_BIN="$(find /home/buketby/virtualenv -type f -path '*/3.13/bin/python' 2>/dev/null | grep -E '/(buket\.by|myapp)/' | head -n 1 || true)"
            fi

            if [[ -z "$PYTHON_BIN" ]]; then
              echo "Python 3.13 virtualenv for buket.by was not found." >&2
              find /home/buketby/virtualenv -maxdepth 5 -type f -name python 2>/dev/null || true
              exit 1
            fi

            echo "Using Python: $PYTHON_BIN"
            "$PYTHON_BIN" -m pip install --upgrade pip setuptools wheel
            "$PYTHON_BIN" -m pip install -r "$BACKEND_DIR/requirements.txt"

            # Миграции и статика
            cd "$BACKEND_DIR"
            "$PYTHON_BIN" manage.py check
            "$PYTHON_BIN" manage.py migrate --noinput
            "$PYTHON_BIN" manage.py collectstatic --noinput --clear

            # Nginx должен иметь право прохода к собранной статике и media.
            mkdir -p "$BACKEND_DIR/staticfiles" "$BACKEND_DIR/media"
            chmod a+rx "$DEPLOY_ROOT" "$BACKEND_DIR"
            chmod -R u+rwX,go+rX "$BACKEND_DIR/staticfiles" "$BACKEND_DIR/media"

            # Создаём ссылки в web-root, только если там ещё нет файлов/каталогов.
            [[ -e "$DEPLOY_ROOT/static" || -L "$DEPLOY_ROOT/static" ]] || ln -s backend/staticfiles "$DEPLOY_ROOT/static"
            [[ -e "$DEPLOY_ROOT/media" || -L "$DEPLOY_ROOT/media" ]] || ln -s backend/media "$DEPLOY_ROOT/media"

            echo "Static/media paths after deploy:"
            ls -ld "$DEPLOY_ROOT" "$BACKEND_DIR" "$BACKEND_DIR/staticfiles" "$BACKEND_DIR/media" "$DEPLOY_ROOT/static" "$DEPLOY_ROOT/media" 2>&1 || true

            # Перезапустить Passenger
            mkdir -p "$BACKEND_DIR/tmp"
            touch "$BACKEND_DIR/tmp/restart.txt"

            # Даём Passenger несколько секунд на перезапуск и печатаем диагностику.
            sleep 5
            HOMEPAGE_STATUS="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' https://buket.by/)"
            STATIC_STATUS="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' https://buket.by/static/logo.png)"
            echo "Homepage HTTP $HOMEPAGE_STATUS"
            echo "Static HTTP $STATIC_STATUS"
            [[ "$HOMEPAGE_STATUS" == "200" ]]
            [[ "$STATIC_STATUS" == "200" ]]

            echo "Deploy done"
