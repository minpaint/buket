name: Deploy to hoster.by

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hosterby-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTER_HOST }}
          username: ${{ secrets.HOSTER_USER }}
          key: ${{ secrets.HOSTER_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd ${{ secrets.HOSTER_DEPLOY_PATH }}

            # Обновить код
            git fetch origin
            git reset --hard origin/main

            # Установить/обновить зависимости
            source /home/buketby/virtualenv/public_html/myapp/backend/3.13/bin/activate
            pip install -q -r backend/requirements.txt

            # Миграции и статика
            cd backend
            python manage.py migrate --noinput
            python manage.py collectstatic --noinput
            cd ..

            # Перезапустить Passenger
            mkdir -p backend/tmp
            touch backend/tmp/restart.txt

            echo "Deploy done"
