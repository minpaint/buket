name: Deploy to hoster.by

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hosterby-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          # The hosting panel migrated the site to a new address; the old
          # HOSTER_HOST secret now times out. The domain always resolves to
          # the active production server.
          host: buket.by
          username: h13592
          key: ${{ secrets.HOSTER_SSH_KEY }}
          port: 22
          script: |
            # hoster.by system profile references optional variables such as
            # SSH_USER, so nounset (-u) is incompatible with its login shell.
            set -Eeo pipefail

            APP_ROOT="$HOME/www/buket.by"
            REPO_ROOT="$APP_ROOT/myapp"
            SOURCE_BACKEND="$REPO_ROOT/backend"
            PYTHON_BIN="$APP_ROOT/.venv/bin/python"

            test -d "$REPO_ROOT/.git"
            test -x "$PYTHON_BIN"

            # Update the repository copy managed by GitHub.
            cd "$REPO_ROOT"
            git fetch origin main
            git reset --hard origin/main

            # Install dependencies into the Python 3.13 environment selected
            # in the hosting panel.
            echo "Using Python: $PYTHON_BIN"
            "$PYTHON_BIN" -m pip install --upgrade pip setuptools wheel
            "$PYTHON_BIN" -m pip install -r "$SOURCE_BACKEND/requirements.txt"

            # The panel runs Django from APP_ROOT, while Git lives in myapp.
            # Copy application code without touching persistent production data.
            rsync -a \
              --exclude='.env' \
              --exclude='db.sqlite3' \
              --exclude='media/' \
              --exclude='static/' \
              --exclude='staticfiles/' \
              --exclude='logs/' \
              --exclude='tmp/' \
              "$SOURCE_BACKEND/" "$APP_ROOT/"

            # Run Django maintenance against the active application.
            cd "$APP_ROOT"
            "$PYTHON_BIN" manage.py check
            "$PYTHON_BIN" manage.py migrate --noinput
            "$PYTHON_BIN" manage.py collectstatic --noinput --clear

            # Nginx serves APP_ROOT/static and APP_ROOT/media directly.
            rsync -a "$APP_ROOT/staticfiles/" "$APP_ROOT/static/"
            chmod 755 "$APP_ROOT"
            chmod -R u+rwX,go+rX "$APP_ROOT/static" "$APP_ROOT/staticfiles" "$APP_ROOT/media"

            # Restart Passenger.
            mkdir -p "$APP_ROOT/tmp"
            touch "$APP_ROOT/tmp/restart.txt"

            # Даём Passenger несколько секунд на перезапуск и печатаем диагностику.
            sleep 5
            HOMEPAGE_STATUS="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' https://buket.by/)"
            STATIC_STATUS="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' https://buket.by/static/logo.png)"
            echo "Homepage HTTP $HOMEPAGE_STATUS"
            echo "Static HTTP $STATIC_STATUS"
            [[ "$HOMEPAGE_STATUS" == "200" ]]
            [[ "$STATIC_STATUS" == "200" ]]

            echo "Deploy done"
